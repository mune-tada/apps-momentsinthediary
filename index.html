<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moments in the Diary — Works</title>
    <meta name="description" content="Moments in the Diary / Works gallery" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <div class="title">Moments in the Diary</div>
          <div class="subtitle">作品ギャラリー</div>
        </div>
        <div class="meta">
          <div><span id="app-count">-</span> works</div>
          <div class="metaSub">updated <span id="updated-at">-</span></div>
        </div>
      </header>

      <div class="toolbar">
        <input id="search" type="search" placeholder="作品を検索（名前 / タグ）" />
      </div>

      <main class="grid" id="app-list" aria-live="polite"></main>

      <footer>
        <div class="footnote">Curated works / momentsinthediary</div>
      </footer>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
